name: Build APK & Release

on:
  push:
    branches: [ master, main, feat/* ]
    tags: [ 'v*' ]
  workflow_dispatch:

jobs:
  build-standard:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Standard Release APK
        run: ./gradlew assembleStandardRelease

      - name: Upload Standard APK
        uses: actions/upload-artifact@v4
        with:
          name: MIMO-standard
          path: app/build/outputs/apk/standard/release/app-standard-release.apk

  build-geckoview:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode Keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build GeckoView Release APK
        run: ./gradlew assembleGeckoviewRelease

      - name: Upload GeckoView APK
        uses: actions/upload-artifact@v4
        with:
          name: MIMO-geckoview
          path: app/build/outputs/apk/geckoview/release/app-geckoview-release.apk

  release:
    needs: [build-standard, build-geckoview]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - name: Download Standard APK
        uses: actions/download-artifact@v4
        with:
          name: MIMO-standard

      - name: Download GeckoView APK
        uses: actions/download-artifact@v4
        with:
          name: MIMO-geckoview

      - name: Rename APKs
        run: |
          mv app-standard-release.apk MIMO-Without_WebView.apk
          mv app-geckoview-release.apk MIMO-With_WebView.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MIMO-Without_WebView.apk
            MIMO-With_WebView.apk
          generate_release_notes: true
